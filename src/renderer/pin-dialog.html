<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security PIN</title>
    <link rel="stylesheet" href="styles/pin-dialog.css">
</head>
<body>
    <div class="pin-container">
        <div class="pin-header">
            <div class="security-icon">🔐</div>
            <h2>Security Verification</h2>
            <p>Enter your 6-digit settings PIN to continue</p>
        </div>

        <div class="pin-content" id="pinContent">
            <div class="pin-input-container">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" autocomplete="off">
            </div>

            <div class="pin-actions">
                <button class="btn-primary" id="verifyBtn" onclick="verifyPIN()" disabled>Verify PIN</button>
                <button class="btn-link" onclick="forgotPIN()">Forgot PIN? Use Email OTP</button>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>

        <div class="otp-content" id="otpContent" style="display: none;">
            <p>A 6-digit OTP has been sent to your recovery email.</p>
            
            <div class="pin-input-container">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" autocomplete="off">
                <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" autocomplete="off">
            </div>

            <div class="pin-actions">
                <button class="btn-primary" id="verifyOtpBtn" onclick="verifyOTP()" disabled>Verify OTP</button>
                <button class="btn-link" onclick="backToPIN()">Back to PIN</button>
            </div>

            <div class="otp-timer">
                <p>OTP expires in: <span id="timer">05:00</span></p>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        // PIN input handling
        const pinInputs = document.querySelectorAll('.pin-input');
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const errorMessage = document.getElementById('errorMessage');

        // Setup PIN inputs
        pinInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Only allow numbers
                if (!/[0-9]/.test(value)) {
                    e.target.value = '';
                    return;
                }

                // Move to next input
                if (value && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }

                checkPinComplete();
            });

            input.addEventListener('keydown', (e) => {
                // Handle backspace
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
                
                // Handle Enter
                if (e.key === 'Enter' && verifyBtn.disabled === false) {
                    verifyPIN();
                }
            });
        });

        // Setup OTP inputs
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                if (!/[0-9]/.test(value)) {
                    e.target.value = '';
                    return;
                }

                if (value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }

                checkOtpComplete();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
                
                if (e.key === 'Enter' && verifyOtpBtn.disabled === false) {
                    verifyOTP();
                }
            });
        });

        function checkPinComplete() {
            const pin = Array.from(pinInputs).map(input => input.value).join('');
            verifyBtn.disabled = pin.length !== 6;
        }

        function checkOtpComplete() {
            const otp = Array.from(otpInputs).map(input => input.value).join('');
            verifyOtpBtn.disabled = otp.length !== 6;
        }

        function verifyPIN() {
            const pin = Array.from(pinInputs).map(input => input.value).join('');
            ipcRenderer.send('verify-pin', pin);
        }

        function verifyOTP() {
            const otp = Array.from(otpInputs).map(input => input.value).join('');
            ipcRenderer.send('verify-otp', otp);
        }

        function forgotPIN() {
            showError('Sending OTP to recovery email...');
            ipcRenderer.send('forgot-pin');
        }

        function backToPIN() {
            document.getElementById('pinContent').style.display = 'block';
            document.getElementById('otpContent').style.display = 'none';
            clearInputs();
            stopTimer();
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            
            if (!message.includes('Sending')) {
                setTimeout(() => {
                    errorMessage.style.display = 'none';
                }, 3000);
            }
        }

        function clearInputs() {
            pinInputs.forEach(input => input.value = '');
            otpInputs.forEach(input => input.value = '');
            checkPinComplete();
            checkOtpComplete();
        }

        function showOTPInterface() {
            document.getElementById('pinContent').style.display = 'none';
            document.getElementById('otpContent').style.display = 'block';
            startTimer();
            otpInputs[0].focus();
        }

        let timerInterval;
        function startTimer() {
            let timeLeft = 300; // 5 minutes in seconds
            const timerElement = document.getElementById('timer');
            
            timerInterval = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showError('OTP has expired. Please request a new one.');
                    backToPIN();
                }
                
                timeLeft--;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Listen for PIN verification result
        ipcRenderer.on('pin-result', (event, result) => {
            if (result.success) {
                // PIN verified successfully - window will close automatically
                return;
            }
            
            if (result.showOtpInput) {
                showOTPInterface();
                showError('');
            } else {
                showError(result.message);
                clearInputs();
            }
        });

        // Focus first input on load
        window.addEventListener('load', () => {
            pinInputs[0].focus();
        });

        // Prevent context menu
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
